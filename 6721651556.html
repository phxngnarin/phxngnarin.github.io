<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assignment #3 — Next Gen Rendering (PBR / Three.js)</title>
<style>
  :root{
    --bg-0:#05070c;
    --bg-1:#0b1120;
    --panel:#0e1526ee;
    --line:#26314a;
    --text:#dbe4f5;
    --text-dim:#7f8db3;
    --accent:#7ee0c9;
    --accent-2:#e0a76f;
    --mono:'JetBrains Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg-0);
    font-family:var(--mono);
    color:var(--text);
  }
  #canvas-wrap{position:fixed; inset:0;}
  canvas{display:block; touch-action:none;}

  #hud-top{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:18px 20px; pointer-events:none; z-index:10;
  }
  #title-block{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    max-width:420px;
    backdrop-filter: blur(6px);
  }
  #title-block h1{
    margin:0 0 2px 0;
    font-size:15px;
    letter-spacing:.03em;
    color:var(--text);
    font-weight:600;
  }
  #title-block p{
    margin:4px 0 0 0;
    font-size:11.5px;
    line-height:1.55;
    color:var(--text-dim);
  }
  #title-block .tag{
    display:inline-block;
    font-size:10px;
    letter-spacing:.08em;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:4px;
    padding:1px 6px;
    margin-bottom:6px;
  }

  #hint{
    position:fixed; bottom:16px; left:20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:11px;
    color:var(--text-dim);
    line-height:1.6;
    max-width:360px;
    z-index:10;
  }
  #hint b{color:var(--accent-2);}

  #legend{
    position:fixed; bottom:16px; right:20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:10.5px;
    color:var(--text-dim);
    z-index:10;
    max-width:230px;
    line-height:1.6;
  }
  #legend .row{display:flex; align-items:center; gap:6px; margin:2px 0;}
  #legend .sw{width:10px; height:10px; border-radius:2px; flex:0 0 auto;}

  /* lil-gui theme tweaks */
  .lil-gui{
    --background-color: #0e1526ee;
    --widget-color: #1a2338;
    --hover-color: #24304d;
    --focus-color: #2c3a5c;
    --number-color: var(--accent);
    --string-color: var(--accent-2);
    --title-background-color: #101a30;
    --title-text-color: var(--accent);
    font-family: var(--mono) !important;
    border:1px solid var(--line);
    border-radius:10px !important;
    overflow:hidden;
  }

  #loading{
    position:fixed; inset:0; background:var(--bg-0);
    display:flex; align-items:center; justify-content:center;
    z-index:100; color:var(--text-dim); font-size:12px; letter-spacing:.08em;
  }
</style>
</head>
<body>

<div id="loading">LOADING SCENE…</div>

<div id="canvas-wrap"></div>

<div id="hud-top">
  <div id="title-block">
    <div class="tag">ASSIGNMENT #3</div>
    <h1>PHONGNARIN RATTANACHATVICHIEN <br> 6721651556</h1>
  </div>
</div>

  <div class="row"><span class="sw" style="background:#7ee0c9"></span> แถวทรงกลม = Roughness 0→1 (ซ้าย→ขวา)</div>
  <div class="row"><span class="sw" style="background:#5c6a8f"></span> แถวบน = Metallic 1.0 · แถวล่าง = Metallic 0.0</div>
</div> -->

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import GUI from "https://unpkg.com/lil-gui@0.19/dist/lil-gui.esm.js";

// ---------------------------------------------------------------
// Renderer / Scene / Camera
// ---------------------------------------------------------------
const wrap = document.getElementById("canvas-wrap");

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a14);
scene.fog = new THREE.FogExp2(0x060a14, 0.028);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.5, 5.2, 9.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 3;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.495;
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.PAN, // repurposed below for light-drag (we intercept before controls act)
};

// Environment map for realistic metallic reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------
// Lights
// ---------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x9fb4ff, 0x1a1208, 0.55);
scene.add(hemi);

const moon = new THREE.DirectionalLight(0x8fa8ff, 0.35);
moon.position.set(-6, 8, -4);
moon.castShadow = false;
scene.add(moon);

// The interactive point light (adjustable via mouse + GUI)
const lightState = {
  x: 2.5, y: 3.2, z: 2.0,
  color: "#ffd7a0",
  intensity: 55,
  distance: 30,
};

const pointLight = new THREE.PointLight(new THREE.Color(lightState.color), lightState.intensity, lightState.distance, 2);
pointLight.castShadow = true;
pointLight.shadow.mapSize.set(1024, 1024);
pointLight.shadow.bias = -0.002;
scene.add(pointLight);

// Visible gizmo bulb (emissive, unaffected by lighting) marking the light position
const bulbGeo = new THREE.SphereGeometry(0.12, 20, 20);
const bulbMat = new THREE.MeshBasicMaterial({ color: lightState.color });
const bulbMesh = new THREE.Mesh(bulbGeo, bulbMat);
pointLight.add(bulbMesh);
// small glow halo
const haloMat = new THREE.SpriteMaterial({
  map: makeGlowTexture(),
  color: lightState.color,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const halo = new THREE.Sprite(haloMat);
halo.scale.set(1.6, 1.6, 1.6);
pointLight.add(halo);

function makeGlowTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function updatePointLight() {
  pointLight.position.set(lightState.x, lightState.y, lightState.z);
  pointLight.color.set(lightState.color);
  pointLight.intensity = lightState.intensity;
  pointLight.distance = lightState.distance;
  bulbMat.color.set(lightState.color);
  haloMat.color.set(lightState.color);
}
updatePointLight();

// ---------------------------------------------------------------
// Ground (PBR)
// ---------------------------------------------------------------
function makeGroundTexture() {
  const size = 512;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#26361f";
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const v = Math.random();
    ctx.fillStyle = `rgba(${40 + v * 60},${70 + v * 90},${30 + v * 40},0.5)`;
    ctx.fillRect(x, y, 1.4, 1.4);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const groundState = { roughness: 0.92, metalness: 0.02, color: "#3d5230" };
const groundMat = new THREE.MeshStandardMaterial({
  map: makeGroundTexture(),
  roughness: groundState.roughness,
  metalness: groundState.metalness,
  color: groundState.color,
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 64), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// thin "structure" ring — a small stone platform under the character (the "สิ่งปลูกสร้าง")
const platformMat = new THREE.MeshStandardMaterial({ color: "#8a8578", roughness: 0.75, metalness: 0.05 });
const platform = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.5, 0.25, 48), platformMat);
platform.position.y = 0.125;
platform.receiveShadow = true;
platform.castShadow = true;
scene.add(platform);

const pillarMat = new THREE.MeshStandardMaterial({ color: "#6b6558", roughness: 0.6, metalness: 0.15 });
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 1.6, 10), pillarMat);
  pillar.position.set(Math.cos(a) * 2.7, 0.8, Math.sin(a) * 2.7);
  pillar.castShadow = true;
  pillar.receiveShadow = true;
  scene.add(pillar);
}

// ---------------------------------------------------------------
// Plants ("สิ่งปลูกสร้าง" ที่มีชีวิต) — simple procedural trees/bushes, PBR materials
// ---------------------------------------------------------------
const trunkMat = new THREE.MeshStandardMaterial({ color: "#4a3222", roughness: 0.95, metalness: 0.0 });
const leafMat = new THREE.MeshStandardMaterial({ color: "#3f7a3a", roughness: 0.85, metalness: 0.0 });
const bushMat = new THREE.MeshStandardMaterial({ color: "#4d8a44", roughness: 0.9, metalness: 0.0 });

const plantsGroup = new THREE.Group();
function makeTree(scale = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 1.2, 8), trunkMat);
  trunk.position.y = 0.6;
  trunk.castShadow = true; trunk.receiveShadow = true;
  g.add(trunk);
  for (let i = 0; i < 3; i++) {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.65 - i * 0.15, 0.9, 10), leafMat);
    cone.position.y = 1.15 + i * 0.55;
    cone.castShadow = true; cone.receiveShadow = true;
    g.add(cone);
  }
  g.scale.setScalar(scale);
  return g;
}
function makeBush(scale = 1) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28, 1), bushMat);
    s.position.set((Math.random() - 0.5) * 0.4, 0.2 + Math.random() * 0.15, (Math.random() - 0.5) * 0.4);
    s.castShadow = true; s.receiveShadow = true;
    g.add(s);
  }
  g.scale.setScalar(scale);
  return g;
}

const plantSpots = [
  [4.6, 0, 2.1], [-4.8, 0, 3.0], [5.4, 0, -2.6], [-5.0, 0, -3.4],
  [7.4, 0, 0.5], [-7.0, 0, 1.2], [0.5, 0, 6.5], [-1.6, 0, -6.8],
  [3.2, 0, 5.6], [-3.6, 0, -5.2],
];
plantSpots.forEach((p, i) => {
  const tree = makeTree(0.9 + Math.random() * 0.6);
  tree.position.set(p[0], p[1], p[2]);
  tree.rotation.y = Math.random() * Math.PI;
  plantsGroup.add(tree);
  if (i % 2 === 0) {
    const bush = makeBush(0.8 + Math.random() * 0.5);
    bush.position.set(p[0] + (Math.random() - 0.5) * 1.2, 0, p[2] + (Math.random() - 0.5) * 1.2);
    plantsGroup.add(bush);
  }
});
scene.add(plantsGroup);

// ---------------------------------------------------------------
// Main Character — stylised PBR robot (Base Color / Metallic / Roughness controlled live)
// ---------------------------------------------------------------
const charState = { baseColor: "#3fa9e0", metalness: 0.85, roughness: 0.28 };

const charMat = new THREE.MeshStandardMaterial({
  color: charState.baseColor,
  metalness: charState.metalness,
  roughness: charState.roughness,
});
// fixed-trim material for contrast (dark, semi-rough) so metallic/roughness changes on charMat read clearly
const trimMat = new THREE.MeshStandardMaterial({ color: "#14161c", metalness: 0.4, roughness: 0.55 });
const eyeMat = new THREE.MeshStandardMaterial({ color: "#ffcf5c", emissive: "#ffb347", emissiveIntensity: 1.4, roughness: 0.3, metalness: 0.0 });

const character = new THREE.Group();

const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.65, 6, 16), charMat);
torso.position.y = 1.35;
character.add(torso);

const chestPlate = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.14), trimMat);
chestPlate.position.set(0, 1.4, 0.36);
character.add(chestPlate);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), charMat);
head.position.y = 2.15;
character.add(head);

const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.12, 0.08), trimMat);
visor.position.set(0, 2.17, 0.24);
character.add(visor);

[-1, 1].forEach((side) => {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 10), eyeMat);
  eye.position.set(side * 0.1, 2.17, 0.29);
  character.add(eye);

  const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), trimMat);
  shoulder.position.set(side * 0.52, 1.68, 0);
  character.add(shoulder);

  const upperArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.4, 4, 10), charMat);
  upperArm.position.set(side * 0.55, 1.32, 0);
  character.add(upperArm);

  const forearm = new THREE.Mesh(new THREE.CapsuleGeometry(0.095, 0.36, 4, 10), trimMat);
  forearm.position.set(side * 0.58, 0.82, 0.05);
  forearm.rotation.x = 0.25;
  character.add(forearm);

  const hip = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.2, 4, 10), trimMat);
  hip.position.set(side * 0.2, 0.85, 0);
  character.add(hip);

  const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.42, 4, 10), charMat);
  thigh.position.set(side * 0.2, 0.5, 0);
  character.add(thigh);

  const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.4, 4, 10), trimMat);
  shin.position.set(side * 0.2, 0.06, 0.02);
  character.add(shin);

  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.32), trimMat);
  foot.position.set(side * 0.2, -0.19, 0.06);
  character.add(foot);
});

const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.5, 0.2), trimMat);
backpack.position.set(0, 1.45, -0.32);
character.add(backpack);

character.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
character.position.y = 0.375; // sit on platform
scene.add(character);

function applyCharacterMaterial() {
  charMat.color.set(charState.baseColor);
  charMat.metalness = charState.metalness;
  charMat.roughness = charState.roughness;
}
applyCharacterMaterial();

function applyGroundMaterial() {
  groundMat.color.set(groundState.color);
  groundMat.roughness = groundState.roughness;
  groundMat.metalness = groundState.metalness;
}

// ---------------------------------------------------------------
// PBR Reference Chart — grid of spheres sweeping Roughness (x) and Metallic (rows)
// ---------------------------------------------------------------
const chartGroup = new THREE.Group();
const steps = 6;
const rows = [1.0, 0.0]; // metalness rows: top = fully metallic, bottom = fully dielectric
rows.forEach((metal, rIdx) => {
  for (let i = 0; i < steps; i++) {
    const rough = i / (steps - 1);
    const mat = new THREE.MeshStandardMaterial({ color: "#c7cdd8", metalness: metal, roughness: rough });
    const sph = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 32), mat);
    sph.position.set(4.9 + i * 0.6, 0.9 - rIdx * 0.62 + 0.24, -4.6);
    sph.castShadow = true; sph.receiveShadow = true;
    chartGroup.add(sph);
  }
});
// small pedestal under the chart
const chartBase = new THREE.Mesh(
  new THREE.BoxGeometry(steps * 0.6 + 0.3, 0.12, 1.0),
  new THREE.MeshStandardMaterial({ color: "#20232c", roughness: 0.6, metalness: 0.1 })
);
chartBase.position.set(4.9 + (steps - 1) * 0.3, 0.35, -4.6);
chartBase.receiveShadow = true; chartBase.castShadow = true;
chartGroup.add(chartBase);
scene.add(chartGroup);

// ---------------------------------------------------------------
// Mouse interaction: right-click-drag on the ground moves the light (x,z)
// ---------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let draggingLight = false;

function setPointerFromEvent(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button === 2) {
    draggingLight = true;
    controls.enabled = false;
    tryDragLight(e);
  }
});
window.addEventListener("pointermove", (e) => {
  if (draggingLight) tryDragLight(e);
});
window.addEventListener("pointerup", (e) => {
  if (e.button === 2 || draggingLight) {
    draggingLight = false;
    controls.enabled = true;
  }
});

function tryDragLight(e) {
  setPointerFromEvent(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const hit = raycaster.intersectObject(ground)[0];
  if (hit) {
    lightState.x = THREE.MathUtils.clamp(hit.point.x, -9, 9);
    lightState.z = THREE.MathUtils.clamp(hit.point.z, -9, 9);
    updatePointLight();
    guiXCtrl.updateDisplay();
    guiZCtrl.updateDisplay();
  }
}

// ---------------------------------------------------------------
// GUI
// ---------------------------------------------------------------
const gui = new GUI({ title: "PBR Controls" });
gui.domElement.style.setProperty("position", "fixed");
gui.domElement.style.setProperty("top", "16px");
gui.domElement.style.setProperty("right", "16px");

const fChar = gui.addFolder("ตัวละครหลัก (Character)");
fChar.addColor(charState, "baseColor").name("Base Color").onChange(applyCharacterMaterial);
fChar.add(charState, "metalness", 0, 1, 0.01).name("Metallic").onChange(applyCharacterMaterial);
fChar.add(charState, "roughness", 0.02, 1, 0.01).name("Roughness").onChange(applyCharacterMaterial);
fChar.open();

const fGround = gui.addFolder("พื้น (Ground)");
fGround.addColor(groundState, "color").name("Base Color").onChange(applyGroundMaterial);
fGround.add(groundState, "metalness", 0, 1, 0.01).name("Metallic").onChange(applyGroundMaterial);
fGround.add(groundState, "roughness", 0.02, 1, 0.01).name("Roughness").onChange(applyGroundMaterial);

const fLight = gui.addFolder("แหล่งกำเนิดแสง (Point Light)");
const guiXCtrl = fLight.add(lightState, "x", -9, 9, 0.05).name("Position X").onChange(updatePointLight);
fLight.add(lightState, "y", 0.3, 9, 0.05).name("Position Y").onChange(updatePointLight);
const guiZCtrl = fLight.add(lightState, "z", -9, 9, 0.05).name("Position Z").onChange(updatePointLight);
fLight.addColor(lightState, "color").name("Color").onChange(updatePointLight);
fLight.add(lightState, "intensity", 0, 150, 1).name("Intensity").onChange(updatePointLight);
fLight.open();

const fScene = gui.addFolder("ฉาก (Scene)");
const sceneState = { autoRotate: false, exposure: renderer.toneMappingExposure };
fScene.add(sceneState, "autoRotate").name("Auto Rotate Camera").onChange(v => controls.autoRotate = v);
fScene.add(sceneState, "exposure", 0.3, 2, 0.01).name("Exposure").onChange(v => renderer.toneMappingExposure = v);

// ---------------------------------------------------------------
// Resize + Render loop
// ---------------------------------------------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById("loading").style.display = "none";

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  character.rotation.y = Math.sin(t * 0.15) * 0.08; // subtle idle sway
  plantsGroup.children.forEach((p, i) => { p.rotation.z = Math.sin(t * 0.6 + i) * 0.02; });
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
